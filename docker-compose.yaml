version: '3.8'
services:
# rdb的容器
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: default
    ports:
      - "3306:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql

# llm的容器
  ollama-embedding:
    image: ollama/ollama:latest
    container_name: ollama-embedding
    ports:
      - "11435:11434"
    volumes:
      - ./volumes/ollama_embedding:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all

  ollama-chat:
    image: ollama/ollama:latest
    container_name: ollama-chat
    ports:
      - "11434:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    environment:
      NVIDIA_VISIBLE_DEVICES: all

# asr的容器，这个容器是docker上没有镜像的，在本项目FastWhisperService下自己制作镜像
  whisper:
    image: whisper:latest
    container_name: whisper-service
    ports:
      - "10350:10350"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [ gpu ]
    environment:
      NVIDIA_VISIBLE_DEVICES: all

# tts的容器
  gpt-sovits:
    image: breakstring/gpt-sovits:v4
    container_name: gpt-sovits
    environment:
      - is_half=False
      - is_share=False
    volumes:
      - ./volumes/sovits/GPT_weights:/workspace/GPT_weights
      - ./volumes/sovits/GPT_weights_v2:/workspace/GPT_weights_v2
      - ./volumes/sovits/GPT_weights_v3:/workspace/GPT_weights_v3
      - ./volumes/sovits/GPT_weights_v4:/workspace/GPT_weights_v4
      - ./volumes/sovits/output:/workspace/output
      - ./volumes/sovits/logs:/workspace/logs
      - ./volumes/sovits/SoVITS_weights:/workspace/SoVITS_weights
      - ./volumes/sovits/SoVITS_weights_v2:/workspace/SoVITS_weights_v2
      - ./volumes/sovits/SoVITS_weights_v3:/workspace/SoVITS_weights_v3
      - ./volumes/sovits/SoVITS_weights_v4:/workspace/SoVITS_weights_v4
      - ./volumes/sovits/reference:/workspace/reference
      - ./volumes/sovits/GPT_SoVITS/pretrained_models:/workspace/GPT_SoVITS/pretrained_models
    working_dir: /workspace
    command: ["python", "api_v2.py","-a","0.0.0.0","-p","9880","-c","GPT_SoVITS/configs/tts_infer.yaml"]
    #command: ["python", "api.py"]
    ports:
      - "9880:9880"
      - "9871:9871"
      - "9872:9872"
      - "9873:9873"
      - "9874:9874"
    shm_size: 16G
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "all"
              capabilities: [gpu]
    stdin_open: true
    tty: true
    restart: unless-stopped

# vdb的容器
  etcd:
    container_name: milvus-etcd
    #image: milvusdb/etcd:3.5.5-r2
    image: milvusdb/etcd:latest
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_DATA_DIR=/etcd
      - ALLOW_NONE_AUTHENTICATION=yes
    volumes:
      - ./volumes/miluvs/etcd:/etcd
    #command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
  minio:
    container_name: milvus-minio
    #image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    image: minio/minio:latest
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./volumes/miluvs/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.10
    command: [ "milvus", "run", "standalone" ]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/miluvs/milvus:/var/lib/milvus
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

networks:
  default:
    name: astrolitha